name: Update crimson contribution snake
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']
permissions:
  contents: write
concurrency:
  group: contribution-snake
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate black and red snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: hatesoberbein
          outputs: |
            assets/contribution-snake.svg?palette=github-dark&color_snake=#ff334f&color_dots=#161b22,#460b16,#85152b,#bf1e38,#ef233c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish updated animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-snake.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update crimson contribution snake"
          git pull --rebase origin main
          git push origin HEAD:main
